<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Palate and Prose</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <h1>PALATE AND PROSE</h1>
  <p>Collection of Poems and Drawings</p>
</header>
<nav>
  <a class="" href="/">Home</a>
  <a class="" href="/about.html">About</a>
  <a class="" href="/poems.html">Poems</a>
  <a class="" href="/drawings.html">Drawings</a>
  <a class="active" href="/contact.html">Contact</a>
  <a href="/login.html">Login</a>
</nav>
<main>
  <section class="card">
    <h2>Contact Us</h2>
    <form id="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit">Send Message</button>
      <div id="result"></div>
    </form>
  </section>
</main>
<script>
document.getElementById("contact-form").addEventListener("submit", async e => {
  e.preventDefault();
  const result = document.getElementById("result");
  const data = Object.fromEntries(new FormData(e.target));
  const res = await fetch("/api/contact", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });
  const out = await res.json();
  result.innerHTML = `<div class="message">${out.message || out.error}</div>`;
  if (res.ok) e.target.reset();
});
</script>
<footer>© 2026 Palate and Prose</footer>
</body>
</html>
